# Botão "Atualizar" na tela de login
atualizacao.habilitada=true

# Link Raw no GitHub apontando para ESTE mesmo arquivo commitado no repositório (troque main pela sua branch se for outra).
# Quando preenchido, o programa baixa esse arquivo na internet e usa instalador.url de lá — assim você só edita no GitHub.
atualizacao.remote-url=https://raw.githubusercontent.com/especialistasdocentro-debug/Aplicativo_CentroCQP/main/atualizacao.properties

# Link direto do setup.exe na Release (pode ficar vazio no .jar se você mantiver só no Raw acima).
instalador.url=https://github.com/especialistasdocentro-debug/Aplicativo_CentroCQP/releases/download/V1.0.0/CQP-Registros-Setup-1.0.0.exe
